name: Daily SEC Intel Update

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every night at midnight UTC
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  update-sec-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SEC Fetcher
        run: python fetch_sec.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sec_intel_data.json
          git commit -m "Auto-update SEC data [skip ci]" || exit 0
          git push
