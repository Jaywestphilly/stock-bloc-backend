name: Daily SEC & Market Intel Update

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every night at midnight UTC
  workflow_dispatch: # Allows manual triggers anytime

jobs:
  update-all-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Market Dependencies
        run: pip install yfinance

      - name: Run SEC Fetcher
        run: python fetch_sec.py

      - name: Run Market Fetcher
        run: python fetch_market.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sec_intel_data.json market_watchlist_data.json
          git commit -m "Auto-update SEC & Market data [skip ci]" || exit 0
          git push
